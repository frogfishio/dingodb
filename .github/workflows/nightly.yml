name: nightly

# Stage 7f packaging: reproducible corruption corpora + performance skeleton
# on a schedule (and on demand). Keeps the main CI job fast while still
# exercising §13 / §16 damage tests and the bench harness regularly.

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  nightly:
    name: corruption + bench packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Full workspace test
        run: cargo test --workspace

      - name: FORMAT_SPEC §13 destructive corpus
        run: cargo test -p dingo-format --test section13_corpus -- --nocapture

      - name: OVERVIEW §16 store suite
        run: cargo test -p dingo-store --test section16_store -- --nocapture

      - name: Stage 6 salvage / store suite
        run: cargo test -p dingo-store --test stage6_store -- --nocapture

      - name: Stage 6 bench skeleton (no marketing gates)
        run: cargo test -p dingo-store --test stage6_bench_skeleton -- --nocapture

      - name: Stage 7 CLI doctor / salvage / serve
        run: cargo test -p dingo-cli --test cli -- --nocapture
