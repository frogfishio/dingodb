name: nightly

# Stage 7f packaging + DEF-090 expensive suites: reproducible corruption
# corpora, full crash matrix, and performance skeleton on a schedule (and on
# demand). Keeps the main CI job fast while remaining **release-blocking** when
# the schedule fails (branch protection should require this workflow green on
# the default branch for release tags).

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  nightly:
    name: corruption + bench packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Full workspace test
        run: cargo test --workspace

      - name: FORMAT_SPEC §13 destructive corpus
        run: cargo test -p dingo-format --test section13_corpus -- --nocapture

      - name: OVERVIEW §16 store suite
        run: cargo test -p dingo-store --test section16_store -- --nocapture

      - name: Stage 6 salvage / store suite
        run: cargo test -p dingo-store --test stage6_store -- --nocapture

      - name: Stage 6 bench skeleton (no marketing gates)
        run: cargo test -p dingo-store --test stage6_bench_skeleton -- --nocapture

      - name: DEF-022 full crash matrix
        env:
          DINGO_CRASH_MATRIX_FULL: "1"
        run: cargo test -p dingo-store --test stage_def_022_crash_matrix -- --nocapture --test-threads=1

      - name: Stage 7 CLI doctor / salvage / serve
        run: cargo test -p dingo-cli --test cli -- --nocapture

      - name: Release content (DEF-003)
        run: ./scripts/release_content.sh

  # DEF-091 — short scheduled fuzz smoke. Property tests already run in the
  # main nightly + PR quality job; this job exercises cargo-fuzz targets when
  # the toolchain is available. Failures are release-blocking when scheduled.
  fuzz_smoke:
    name: DEF-091 fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + cargo-fuzz
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz smoke (30s per target)
        working-directory: fuzz
        run: |
          set -euo pipefail
          for t in decode_frame cbor_envelope scan_forward scan_reverse; do
            echo "== fuzz $t =="
            cargo +nightly fuzz run "$t" -- -max_total_time=30 -timeout=5
          done
