# DEF-090 — dependency / license / advisory policy for cargo-deny.
# Run: cargo deny check
# CI: .github/workflows/ci.yml audit job

[graph]
all-features = true
# Workspace is multi-license; targets are host defaults.

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates are warnings until replaced deliberately.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  # First-party product licenses (see doc/reference/operations/LICENSING.md).
  "AGPL-3.0",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]
# Clarify exceptions for crates that ship dual licenses or unusual SPDX.
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
