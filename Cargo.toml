[workspace]
members = [
  "crates/sda-core",
  "crates/sda-cli",
  "crates/dingo-format",
  "crates/dingo-store",
  "crates/dingo-client",
  "crates/dingo-sdk",
  "crates/dingo-server",
  "crates/dingo-examine",
  "crates/dingo-cli",
  "crates/dingo-cluster",
  "crates/dingo-testrig",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
# DEF-090 MSRV: keep in sync with .github/workflows/ci.yml `msrv` job and
# CONTRIBUTING.md. Bump deliberately when a dependency or language feature
# requires a newer compiler (`is_multiple_of` needs ≥1.87).
rust-version = "1.88.0"
# Multi-tier licensing (not a single workspace license). Per-crate SPDX in
# each package; policy in doc/LICENSING.md. MIT was temporary scaffolding only.
authors = ["Alexander R. Croft"]
repository = "https://github.com/frogfishio/dingodb"

[workspace.dependencies]
# Directory is crates/sda-core; published package name is dingo-sda (not bare
# `sda` / `sda-lib` — those crates.io names must not be reused). Dependents that
# use the workspace key import as `sda_core`. Inside the package, the crate path
# is `dingo_sda`. `version` is required so `cargo package` can rewrite path deps.
sda-core = { package = "dingo-sda", path = "crates/sda-core", version = "0.2.0" }
dingo-format = { path = "crates/dingo-format", version = "0.2.0" }
dingo-store = { path = "crates/dingo-store", version = "0.2.0" }
dingo-client = { path = "crates/dingo-client", version = "0.2.0" }
dingo-sdk = { path = "crates/dingo-sdk", version = "0.2.0" }
dingo-server = { path = "crates/dingo-server", version = "0.2.0" }
dingo-examine = { path = "crates/dingo-examine", version = "0.2.0" }
dingo-cluster = { path = "crates/dingo-cluster", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
blake3 = "1"
crc32c = "0.6"
getrandom = "0.3"
tempfile = "3"

