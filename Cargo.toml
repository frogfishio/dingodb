[workspace]
members = [
  "crates/sda-core",
  "crates/sda-cli",
  "crates/dingo-format",
  "crates/dingo-store",
  "crates/dingo-client",
  "crates/dingo-sdk",
  "crates/dingo-server",
  "crates/dingo-examine",
  "crates/dingo-cli",
  "crates/dingo-cluster",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Multi-tier licensing (not a single workspace license). Per-crate SPDX in
# each package; policy in doc/LICENSING.md. MIT was temporary scaffolding only.
authors = ["Alexander R. Croft"]
repository = "https://github.com/frogfishio/dingodb"

[workspace.dependencies]
# Directory is crates/sda-core; published package name remains sda-lib for crates.io.
# Dependents that use the workspace key import the crate as `sda_core`.
# `version` is required so `cargo package` can rewrite path deps for publish.
sda-core = { package = "sda-lib", path = "crates/sda-core", version = "0.1.0" }
dingo-format = { path = "crates/dingo-format", version = "0.1.0" }
dingo-store = { path = "crates/dingo-store", version = "0.1.0" }
dingo-client = { path = "crates/dingo-client", version = "0.1.0" }
dingo-sdk = { path = "crates/dingo-sdk", version = "0.1.0" }
dingo-server = { path = "crates/dingo-server", version = "0.1.0" }
dingo-examine = { path = "crates/dingo-examine", version = "0.1.0" }
dingo-cluster = { path = "crates/dingo-cluster", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
blake3 = "1"
crc32c = "0.6"
getrandom = "0.3"
tempfile = "3"

