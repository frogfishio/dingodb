[workspace]
members = [
  "crates/sda-core",
  "crates/sda-cli",
  "crates/residuum-format",
  "crates/residuum-heap",
  "crates/residuum-authority",
  "crates/residuum-store",
  "crates/residuum-client",
  "crates/residuum-sdk",
  "crates/residuum-server",
  "crates/residuum-examine",
  "crates/residuum-cli",
  "crates/residuum-cluster",
  "crates/residuum-testrig",
  "verification/heap-verus",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
# DEF-090 MSRV: keep in sync with .github/workflows/ci.yml `msrv` job and
# CONTRIBUTING.md. Bump deliberately when a dependency or language feature
# requires a newer compiler (`is_multiple_of` needs ≥1.87).
rust-version = "1.88.0"
# Multi-tier licensing (not a single workspace license). Per-crate SPDX in
# each package; policy in doc/LICENSING.md. MIT was temporary scaffolding only.
authors = ["Alexander R. Croft"]
repository = "https://github.com/frogfishio/dingodb"

[workspace.dependencies]
# Directory is crates/sda-core; published package name is residuum-sda (not bare
# `sda` / `sda-lib` — those crates.io names must not be reused). Dependents that
# use the workspace key import as `sda_core`. Inside the package, the crate path
# is `residuum_sda`. `version` is required so `cargo package` can rewrite path deps.
sda-core = { package = "residuum-sda", path = "crates/sda-core", version = "0.2.0" }
residuum-format = { path = "crates/residuum-format", version = "0.2.0" }
residuum-heap = { path = "crates/residuum-heap", version = "0.2.0" }
residuum-authority = { path = "crates/residuum-authority", version = "0.2.0" }
# default-features false: public raw `Store` is opt-in via `legacy-raw-store`
# (HP-003 / CPR-001). Dependents that need Stages 3–9 flat store enable the feature.
residuum-store = { path = "crates/residuum-store", version = "0.2.0", default-features = false }
residuum-client = { path = "crates/residuum-client", version = "0.2.0" }
residuum-sdk = { path = "crates/residuum-sdk", version = "0.2.0" }
residuum-server = { path = "crates/residuum-server", version = "0.2.0" }
residuum-examine = { path = "crates/residuum-examine", version = "0.2.0" }
residuum-cluster = { path = "crates/residuum-cluster", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
blake3 = "1"
crc32c = "0.6"
getrandom = "0.3"
tempfile = "3"
# Lightweight HTTP for optional AWS KMS connector (residuum-store `aws-kms`).
ureq = { version = "2", default-features = false, features = ["tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"