[package]
name = "dingo-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
authors.workspace = true
description = "DingoDB cluster federation: partitions, coverage, placement, multi-node stores, Raft, convergent-append, find coverage/paging, rebalance, anti-entropy repair, verification sim (Stage 8)."
readme = "README.md"
repository.workspace = true
keywords = ["dingodb", "cluster", "partition", "replication", "coverage"]
categories = ["database", "database-implementations"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

[dependencies]
dingo-store = { workspace = true, features = ["legacy-raw-store"] }
blake3.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Multi-process OS chaos child (DEF-041-N). Invoked by stage_def_041n_multiproc.
[[bin]]
name = "dingo-cluster-multiproc-child"
path = "src/bin/multiproc_child.rs"
doc = false