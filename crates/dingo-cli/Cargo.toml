[package]
name = "dingo-cli"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
authors.workspace = true
description = "DingoDB command-line interface: put/get, doctor, salvage, and serve (Stage 7)."
readme = "README.md"
repository.workspace = true
keywords = ["dingodb", "cli", "doctor", "salvage", "database"]
categories = ["command-line-utilities", "database"]
include = ["BUILD", "Cargo.toml", "README.md", "build.rs", "src/**", "tests/**"]

[[bin]]
name = "dingo"
path = "src/main.rs"

[dependencies]
dingo-sdk.workspace = true
dingo-store.workspace = true
dingo-examine.workspace = true
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
