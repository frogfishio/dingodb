[package]
name = "dingo-sda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
description = "DingoDB hybrid evaluator for Structured Data Algebra (SDA) plus additive ENR1 enrichment — pure Rust, no storage IO."
readme = "README.md"
repository.workspace = true
keywords = ["dingodb", "sda", "enr", "json", "transformation"]
categories = ["data-structures", "parser-implementations", "text-processing"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**", "examples/**"]

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true

# Diagnostic SDA phase breakdown (not a published SLO).
[[example]]
name = "sda_latency_breakdown"
path = "examples/sda_latency_breakdown.rs"
