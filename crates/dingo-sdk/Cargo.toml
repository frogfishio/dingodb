[package]
name = "dingo-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DingoDB collection SDK: collections, filters, indexes, history, remote + cluster connect (Stages 4+6+7+8d)."
readme = "README.md"
repository.workspace = true
keywords = ["dingodb", "sdk", "embedded", "json", "database"]
categories = ["database", "api-bindings"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

[dependencies]
dingo-store.workspace = true
dingo-cluster.workspace = true
sda-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
x509-parser = "0.16"

[dev-dependencies]
tempfile.workspace = true
rcgen = "0.13"
