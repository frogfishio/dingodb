[package]
name = "dingo-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
authors.workspace = true
description = "DingoDB single-node append store: segments, durability, catalogs, chunks, history, tiers (Stages 3+6+9)."
readme = "README.md"
repository.workspace = true
keywords = ["dingodb", "store", "append-only", "salvage", "durability"]
categories = ["database-implementations", "filesystem"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**", "crash_matrix.v1.json"]

[features]
default = ["legacy-raw-store"]
# Public unscoped [`Store`] for Stages 3–9 callers. Disable for the qualified
# heap isolation surface (`StoreHost` / `HeapStore` façades only).
legacy-raw-store = []
# Local-only staged genesis / publish used by `dingo-authority` (HP-005).
# MUST NOT be enabled in the qualified data-service target.
authority-provisioning = []

[dependencies]
dingo-format.workspace = true
dingo-heap.workspace = true
thiserror.workspace = true
blake3.workspace = true
getrandom.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

# Multi-process crash harness for DEF-022 (not a product CLI).
[[bin]]
name = "dingo-store-crash-child"
path = "src/bin/crash_child.rs"
doc = false
required-features = ["legacy-raw-store"]
