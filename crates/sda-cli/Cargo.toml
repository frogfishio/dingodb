[package]
name = "residuum-sda-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
description = "CLI for DingoDB's SDA+ENR1 hybrid evaluator: eval, check, and format programs over JSON."
readme = "README.md"
repository.workspace = true
keywords = ["dingodb", "sda", "enr", "cli", "json"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]
include = ["BUILD", "Cargo.toml", "README.md", "build.rs", "src/**", "tests/**"]

[[bin]]
name = "residuum-sda"
path = "src/main.rs"

[dependencies]
sda-core.workspace = true
serde_json.workspace = true
clap.workspace = true
