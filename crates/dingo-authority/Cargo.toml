[package]
name = "dingo-authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
authors.workspace = true
description = "DingoDB local-only heap authority ceremony tool (AGPL). Never linked by the data server."
readme = "README.md"
repository.workspace = true
keywords = ["dingodb", "authority", "heap", "ceremony"]
categories = ["command-line-utilities", "cryptography"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

[[bin]]
name = "dingo-authority"
path = "src/main.rs"

[dependencies]
dingo-heap.workspace = true
dingo-format.workspace = true
dingo-store = { workspace = true, features = ["legacy-raw-store", "authority-provisioning"] }
thiserror.workspace = true
clap.workspace = true
blake3.workspace = true
getrandom.workspace = true
sha2 = "0.10"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
tempfile = { workspace = true }

[dev-dependencies]
tempfile.workspace = true