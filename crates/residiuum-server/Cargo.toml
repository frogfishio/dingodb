[package]
name = "residiuum-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
authors.workspace = true
description = "Residiuum networked server: accept loop, authz, admission, Raft RPC glue (AGPL)."
readme = "README.md"
repository.workspace = true
keywords = ["residiuum", "server", "raft", "rpc"]
categories = ["database", "network-programming"]
include = ["Cargo.toml", "README.md", "src/**", "tests/**"]

[dependencies]
residiuum-sdk = { workspace = true, features = ["cluster"] }
residiuum-client.workspace = true
residiuum-heap.workspace = true
residiuum-store = { workspace = true, features = ["legacy-raw-store"] }
residiuum-cluster.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

[dev-dependencies]
tempfile.workspace = true
residiuum-format.workspace = true
residiuum-store = { workspace = true, features = ["legacy-raw-store"] }
ed25519-dalek = { version = "2.1.1", default-features = false, features = [
  "alloc",
  "fast",
  "zeroize",
] }
hex = "0.4"
sha2 = "0.10"
rcgen = "0.13"